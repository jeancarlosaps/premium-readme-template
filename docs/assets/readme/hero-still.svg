      <text x="80" y="190" fill="#2340F5" font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="2.4" font-weight="700">A DOCUMENTATION SYSTEM FOR CODING AGENTS</text>
      <g fill="#101114" font-family="'Helvetica Neue', Helvetica, Arial, 'Segoe UI', Roboto, 'Liberation Sans', sans-serif" font-weight="800">
        <text x="76" y="318" font-size="140" textLength="560" lengthAdjust="spacingAndGlyphs">Premium</text>
        <text x="74" y="446" font-size="140" textLength="604" lengthAdjust="spacingAndGlyphs">README</text>
      </g>
    </g>
    <rect class="m-caret" x="698" y="346" width="34" height="100" fill="#2340F5"/>
