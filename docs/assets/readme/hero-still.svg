      <path d="M40 64V40h24M1536 40h24v24M40 696v24h24M1536 720h24v-24"/>
    </g>
    <g font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="2">
      <text x="80" y="76" fill="#101114" font-weight="700">PRT/01</text>
      <text x="180" y="76" fill="#555A66">PREMIUM README TEMPLATE</text>
      <text x="1520" y="76" fill="#555A66" text-anchor="end">PROOF SHEET — REV. 01</text>
    </g>
    <path d="M80 96h1440" stroke="#101114" stroke-opacity=".18"/>
    <path d="M80 96h112" stroke="#2340F5" stroke-width="3"/>

    <!-- copy -->
