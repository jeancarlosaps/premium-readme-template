<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Premium README Template — Beautiful documentation. Real engineering.</title>
  <desc id="desc">Editorial proof sheet. On the left, the name Premium README and the tagline. On the right, four stacked sheets drawn in isometric view, from bottom to top: code, architecture, documentation and the finished README experience. The animation plays once in under four seconds and is disabled when reduced motion is requested; hero-still.svg is the final frame.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#101114" opacity=".09"/></pattern>
    <clipPath id="frame"><rect width="1600" height="760" rx="24"/></clipPath>
    <rect id="sheet" width="320" height="320" rx="10"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="760" fill="#F4F2EC"/>
    <rect width="1600" height="760" fill="url(#dots)"/>

    <!-- crop marks and header rule -->
